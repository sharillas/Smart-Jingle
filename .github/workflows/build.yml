name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
            command: npm run dist:win
            artifact: |
              release/*.exe
              release/*.msi
              release/*.yml
              release/*.blockmap
          - os: macos-latest
            name: mac
            command: npm run dist:mac
            artifact: |
              release/*.dmg
              release/*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installers
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # For full macOS signing + notarization (removes Gatekeeper warning),
          # add these repository secrets and uncomment below, then set
          # "hardenedRuntime": true in package.json build.mac.
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SMART_JINGLE_SMOKE = '1'
          & "release/win-unpacked/Smart Jingle.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: smart-jingle-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install module dev deps (for manifest validation)
        working-directory: companion
        run: npm install --no-audit --no-fund
      - name: Pack companion module
        run: npm run pack:companion
      - uses: actions/upload-artifact@v4
        with:
          name: smart-jingle-companion
          path: release/companion/*.tgz
          if-no-files-found: error

  release:
    needs: [desktop, companion]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Jingle ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.tgz
